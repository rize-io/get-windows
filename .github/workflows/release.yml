name: Build & publish binary node

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  build:
    # windows-latest (Server 2025) ships VS 2026, which node-gyp 10 cannot detect.
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Serial so the two jobs never race to create the same release.
      max-parallel: 1
      matrix:
        include:
          - host: x64
            target: x64
          - host: x86
            target: ia32
    name: Windows (node=22, host=${{ matrix.host }}, target=${{ matrix.target }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: ${{ matrix.host }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.host }}
      - run: npm install --ignore-scripts
      - name: Build and package binaries
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.target }}
          V: 1
        run: |
          set -euo pipefail
          ./node_modules/.bin/node-pre-gyp configure --target_arch="$TARGET_ARCH" --verbose
          ./node_modules/.bin/node-pre-gyp build --target_arch="$TARGET_ARCH" --verbose
          ./node_modules/.bin/node-pre-gyp package --target_arch="$TARGET_ARCH" --verbose
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-binaries-${{ matrix.target }}
          path: build/stage/*/*
          retention-days: 7
      # Attaches to the release tagged v<package.json version>, creating it if missing.
      - name: Upload binaries to GitHub Release
        run: ./node_modules/.bin/node-pre-gyp-github publish --release
        env:
          NODE_PRE_GYP_GITHUB_TOKEN: ${{ github.token }}
